# VAULT LIVENESS CONTRACT — arifOS Federation
# Ratified: 2026-06-09
# Purpose: Defines when VAULT999 audit state is fresh enough to trust.
# This contract degrades readiness when the vault is stale — preventing
# the kernel from claiming SEAL-grade authority on stale evidence.
#
# NO STATIC TRUTH — this contract is self-verifying against live vault state.

schema_version: 2
kind: arifos.vault_liveness
status: contract
last_verified: "2026-06-09"

# ── Freshness Bands ──
# These are the thresholds that determine readiness degradation.
freshness_bands:
  fresh:
    max_age_seconds: 3600        # ≤1 hour: fully trusted
    readiness: GREEN
  warming:
    max_age_seconds: 14400       # ≤4 hours: trusted with note
    readiness: YELLOW
  stale:
    max_age_seconds: 86400       # ≤24 hours: degraded, HOLD on SEAL
    readiness: RED
  expired:
    max_age_seconds: .inf         # >24 hours: VOID on SEAL, read-only
    readiness: BLACK

# ── Chain Integrity ──
chain_requirements:
  min_seals: 1                   # At least one seal must exist
  max_gap_seals: 120             # Historical gap tolerance (pre-May-2026 migration)
  require_merkle_chain: true     # Every seal must have prev_seal_id
  verify_sha256: true            # Content hash must match

# ── Readiness Degradation ──
# When vault liveness degrades, these constitutional effects apply:
degradation_effects:
  GREEN:
    seal_allowed: true
    judge_allowed: true
    forge_allowed: true
    note: "Full authority — vault is fresh."
  YELLOW:
    seal_allowed: true
    judge_allowed: true
    forge_allowed: true
    note: "Vault is warming. Proceed, but recent seals may not be reflected."
  RED:
    seal_allowed: false          # HOLD — cannot seal on stale vault
    judge_allowed: true
    forge_allowed: false         # HOLD — cannot execute on stale audit
    note: "Vault is stale >4h. Audit trail is degraded. SEAL and FORGE are HOLD."
  BLACK:
    seal_allowed: false
    judge_allowed: false
    forge_allowed: false
    note: "Vault is expired >24h. System is read-only. All writes are VOID."

# ── Sovereign Cadence Exemption (F13 sah 2026-11-15, "ok sah. execute all") ──
# GAP 7 / SCAR-VAULT-2026-11-15: age-of-last-sovereign-seal measures the
# sovereign's cadence, not chain health. A chain that verifies (canonical gaps
# 0, merkle intact) whose last FULL seal was the sovereign hand (actor=arif,
# ed25519, SOVEREIGN — e.g. seq 61, 2026-11-10) is "awaiting the sovereign
# hand", NOT "audit degraded". Exemption caps liveness effect at YELLOW; agent
# seals remain PARTIAL-capable (no agent full-seal — Gödel, untouched).
# Any canonical chain gap voids the exemption immediately (falls to RED/BLACK).
# STATUS (2026-11-15, verifier two-rhythm finding): this block is a CODIFIED
# HYPOTHESIS — inert until consumer wiring AND split-signal data (append-stream
# liveness vs seal cadence, measured separately) justify the numbers. Option C
# governs: collect both rhythms first, then calibrate bands. Do not treat the
# conditions below as ratified calibration.
sovereign_cadence_exemption:
  enabled: true
  last_verified: "2026-11-15"
  conditions:
    canonical_chain_verified: true
    last_full_seal_actor: "arif"
    last_full_seal_method: "ed25519"
    zero_genuine_unlinked: true
  effect:
    readiness_cap: "YELLOW"
    seal_allowed: true
    judge_allowed: true
    forge_allowed: true
    label: "awaiting_sovereign"
    note: "Chain intact, sovereign cadence pending. Not a defect. Any chain gap voids this exemption."
  consumer_wiring: pending

# ── Self-Verification ──
self_verification:
  endpoint: "http://localhost:5001/health"
  probe_field: "vault_seals_count"
  probe_field_chain: "chain_height"
  probe_field_last_write: "last_seal_timestamp"
  verify_interval_seconds: 300   # Check every 5 minutes
  degradation_on_probe_failure: RED
