# ─── Loop Architecture (corrected per HOLD verdict) ─────────────────────────
# SEAL emits a Skill Delta Event. INIT reloads body plan only. Scaffold
# proposes, never applies. Diff is a missing stage now added. Tests prove
# survival. Judge approves semantic change. Cooling rate-limits. A-FORGE
# applies ONLY after all gates pass.

loop:
  trigger: SEAL
  mutation_allowed_per_stage: false  # applied_automatically: false throughout
  stages:
    - name: seal_receipt_lock
      mutation: false
      output: SkillDeltaEvent
    - name: init_regeneration
      mutation: false
      loads: [canonical_tool_surface, organ_boundaries, authority_tiers, evidence_floor_rules, extinction_ledger, survivor_skill_contracts, cooling_policy]
    - name: scaffold_rebuild
      mutation: false
      output: proposed_skill_delta
      applies_automatically: false
    - name: skill_diff                  # NEW: stage that was missing
      mutation: false
      compares: [old_skill_contract, proposed_skill_contract]
      detects: [weakened_gate, expanded_autonomy, hidden_mutation, authority_drift]
    - name: survivor_tests
      mutation: false
      required: [old_receipts_replay, extinct_tools_not_resurrected, all_12_skills_present, A_FORGE_cannot_execute_without_anchor, no_fake_GREEN]
    - name: organ_rebind
      condition: tests_pass
      mutation: routing_only
    - name: judge_gate
      required_for: [skill_contract_change, execution_policy_change, autonomy_band_change]
      owner: arifOS_judge
    - name: cooling
      required: true
      blocks: [repeated_SEAL_regeneration_loops, immediate_execution_after_policy_change]
    - name: resume
      condition: [judge_passed_or_no_mutation, cooling_complete, no_unresolved_HOLD]

# ─── Autonomy Zones ──────────────────────────────────────────────────────────
autonomous_allowed:
  - detect_that_skill_update_is_needed
  - draft_skill_delta
  - run_tests
  - compare_against_previous_contract
  - generate_receipt
  - recommend_resume_or_hold

autonomous_forbidden:
  - change_execution_policy_without_judge
  - weaken_human_ack
  - remove_cooling
  - change_F13_boundary
  - mutate_A_FORGE_execution_rules
  - mark_self_as_sealed

# ─── Hard Rules (Skill Delta Engine boundary) ────────────────────────────────
skill_delta_engine:
  inputs: [seal_receipt, current_skill_contracts, extinction_ledger, organ_registry, last_cooling_state]
  outputs: [proposed_skill_delta, risk_class, affected_organs, tests_required, judge_required, resume_allowed]
  hard_rules:
    - cannot_apply_patch
    - cannot_change_tool_surface
    - cannot_change_A_FORGE_policy
    - cannot_mark_SEAL
    - cannot_bypass_cooling
    - cannot_weaken_human_ack
    - cannot_mutate_F13_boundary

# ─── Missing Invariants (corrected per HOLD verdict) ────────────────────────
# These are the doctrine additions the previous version omitted. Each is
# checked at engine boundary + inside SkillDeltaEngine.evaluate().

missing_invariants:
  physics_noether_discipline:
    statement: every symmetry implies conservation; no hidden state change.
    enforced_by: [seal_shadow.sha256_chain, lineage_and_replay.contract.must_preserve]
  biology_immune_memory:
    statement: scars update thresholds, not identity; immune memory must not become autoimmune attack.
    enforced_by: [scar_learning.contract.must_never_weaken, immune_response.contract.tests]
  chemistry_activation_barrier:
    statement: reaction requires threshold; catalyst (A-FORGE) must NOT lower activation energy for forbidden reactions.
    enforced_by: [reaction_gating.contract.tests, execution_discipline.contract.tests]

# ─── Autonomy Bands ─────────────────────────────────────────────────────────
autonomy:
  digital_code: MUBAH                    # commit/push/restart free per AGENTS.md §10
  physical_human_money: FARD              # 888_HOLD required
  irreversible_seal: F13_REQUIRED        # actor != judge
