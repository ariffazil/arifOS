name: Federation ABI Conformance

on:
  pull_request:
    paths:
      - 'contracts/schemas/**'
      - 'contracts/fixtures/**'
      - 'scripts/validate_federation_abi.py'
  push:
    branches: [main]
    paths:
      - 'contracts/schemas/**'
      - 'contracts/fixtures/**'
      - 'scripts/validate_federation_abi.py'

jobs:
  abi-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Schema syntax check
        run: python scripts/validate_federation_abi.py --schema-only

      - name: SHA256SUMS integrity
        run: |
          sha256sum --check contracts/schemas/SHA256SUMS
          python scripts/validate_federation_abi.py --check-sums

      - name: Full conformance suite
        run: python scripts/validate_federation_abi.py

      - name: Single schema root (no v2, no dual tree)
        run: |
          v2_count=$(find contracts/schemas -name '*v2*' 2>/dev/null | wc -l)
          if [ "$v2_count" -gt 0 ]; then
            echo "❌ v2 schema files detected under contracts/schemas"
            find contracts/schemas -name '*v2*'
            exit 1
          fi
          if [ -d docs/schemas ]; then
            dual=$(find docs/schemas -name 'federation-*.v1.schema.json' 2>/dev/null | wc -l)
            if [ "$dual" -gt 0 ]; then
              echo "❌ Dual schema tree under docs/schemas — canonical root is contracts/schemas only"
              find docs/schemas -name 'federation-*.v1.schema.json'
              exit 1
            fi
          fi
          echo "✅ Single schema root confirmed (contracts/schemas v1.0.0 only)"
