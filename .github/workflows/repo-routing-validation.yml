name: Repo Routing Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches-ignore: []


permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-routing:
    if: github.actor != 'dependabot[bot]' && github.actor != 'app/dependabot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate REPO trailer
        run: |
          set -euo pipefail

          TARGET_REPO="${{ github.event.pull_request.base.repo.name }}"
          echo "Target repo: $TARGET_REPO"
          echo "Target repo (lowercase): ${TARGET_REPO,,}"

          # M4 FIX 2026-07-31 (repo-routing-validation gate that never fired):
          #
          # Bug 1: `echo "$COMMITS" | while ... FAILED+=(...)` runs the loop in
          #         a PIPELINE SUBSHELL — variable mutations are lost when the
          #         subshell exits, so the FAILED array was always empty and
          #         `exit 1` never fired. The gate was decorative.
          #
          # Bug 2: `git log --format='%H %B'` returns one record per commit
          #         where the body is MULTI-LINE; `while read sha body` only
          #         reads the FIRST line of each body, treating subsequent
          #         body lines (e.g. "REPO=arifOS" trailer) as separate fake
          #         "commits" — so even with bug 1 fixed, valid trailers
          #         would be mis-parsed.
          #
          # Fix:
          #   - Use process substitution `< <(git rev-list ...)` so the loop
          #     body runs in the MAIN shell (FAILED persists).
          #   - Fetch body per commit via `git log -1 --format='%B'` so multi-
          #     line trailers stay attached to their commit hash.

          declare -a FAILED=()
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            body=$(git log -1 --format='%B' "$sha")
            if ! echo "$body" | grep -qi "^REPO="; then
              echo "❌ Commit $sha: Missing REPO= trailer"
              FAILED+=("commit $sha: no REPO= trailer")
            else
              DECLARED=$(echo "$body" | grep -i "^REPO=" | sed 's/^REPO=//i' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
              if [ "$DECLARED" != "${TARGET_REPO,,}" ]; then
                echo "❌ Commit $sha: REPO mismatch (got '$DECLARED', expected '$TARGET_REPO')"
                FAILED+=("commit $sha: REPO=$DECLARED does not match target $TARGET_REPO")
              else
                echo "✅ Commit $sha: REPO=$DECLARED ✓"
              fi
            fi
          done < <(git rev-list origin/main..HEAD 2>/dev/null || git rev-list HEAD)

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo ""
            echo "============================================"
            echo "🛑 ROUTING VALIDATION FAILED"
            echo "============================================"
            for msg in "${FAILED[@]}"; do
              echo "  - $msg"
            done
            echo "All commit messages must include: REPO=<target-repo>"
            echo "Target repo for this PR: $TARGET_REPO"
            exit 1
          fi

          echo ""
          echo "✅ All commits have valid REPO= trailers"
