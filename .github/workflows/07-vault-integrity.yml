# ═══════════════════════════════════════════════════════════════════════════
# VAULT999 Hash-Chain Integrity Check
# Verifies SEALED_EVENTS.jsonl prev_hash → chain_hash linkage is unbroken.
# Runs daily + on push to main touching vault files.
# ═══════════════════════════════════════════════════════════════════════════
name: "🔏 Vault Integrity"

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily (10:00 MYT)
  push:
    branches: [main]
    paths:
      - "VAULT999/**"
      - "arifosmcp/core/vault*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-integrity
  cancel-in-progress: false  # Never cancel an integrity check in flight

jobs:
  chain-verify:
    if: github.actor != 'dependabot[bot]' && github.actor != 'app/dependabot'
    name: "🔏 Hash-Chain Verify"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify SEALED_EVENTS hash chain
        run: |
          python3 - <<'PY'
          import json
          import sys

          VAULT_FILE = "VAULT999/SEALED_EVENTS.jsonl"

          # ── F13-ratified legacy exceptions (frozen 2026-09-11) ──────────────
          # Chain corruption at line 4 (malformed JSON) split the ledger; F13
          # ratified Option 1 ("2=1") via promotion-gate classification — the
          # legacy prefix is DOCUMENTED DAMAGE, never to be rewritten in place.
          # Evidence:
          #   VAULT999/INVESTIGATION_REPORT_959_UNLINKED_SEAL_ENTRIES.md
          #   VAULT999/chain_tombstone_manifest.json (861 documented entries)
          # JSONL is append-only, so line numbers are stable.
          # Contract: these exact anomalies are tolerated and counted; ANY NEW
          # bad-JSON line or broken link FAILS the check.
          LEGACY_BAD_JSON_LINES = {4}
          LEGACY_BROKEN_LINK_LINES = {588, 589, 1029}

          try:
              with open(VAULT_FILE) as f:
                  lines = [l.strip() for l in f if l.strip()]
          except FileNotFoundError:
              print(f"SKIP: {VAULT_FILE} not present in repo checkout")
              sys.exit(0)

          print(f"Loaded {len(lines)} entries from {VAULT_FILE}")

          new_bad_json = []
          new_broken = []
          legacy_bad_json = 0
          legacy_broken = 0
          segment_anchors = 0
          dupes = 0
          prev_chain_hash = None
          seen_event_ids = {}

          for i, raw in enumerate(lines, 1):
              try:
                  entry = json.loads(raw)
              except json.JSONDecodeError:
                  if i in LEGACY_BAD_JSON_LINES:
                      legacy_bad_json += 1
                      prev_chain_hash = None  # legacy damage resets linkage
                  else:
                      new_bad_json.append(i)
                  continue

              event_id = entry.get("event_id", "")
              chain_hash = entry.get("chain_hash", "")
              prev_hash = entry.get("prev_hash", "")

              if event_id and event_id in seen_event_ids:
                  dupes += 1  # legacy region carries dupes — counted, non-fatal
              elif event_id:
                  seen_event_ids[event_id] = i

              if prev_hash in ("", "GENESIS", "genesis"):
                  # Segment anchor — a chain restart, legitimate by design
                  segment_anchors += 1
                  prev_chain_hash = chain_hash or None
                  continue

              if prev_chain_hash is not None and prev_hash != prev_chain_hash:
                  if i in LEGACY_BROKEN_LINK_LINES:
                      legacy_broken += 1
                      prev_chain_hash = chain_hash or prev_chain_hash
                  else:
                      new_broken.append(
                          f"line {i}: prev_hash={prev_hash!r} != expected={prev_chain_hash!r}"
                      )

              prev_chain_hash = chain_hash if chain_hash else prev_chain_hash

          print(f"Segment anchors (GENESIS/empty prev): {segment_anchors}")
          print(f"Legacy exceptions honored: bad_json={legacy_bad_json} broken_links={legacy_broken}")
          if dupes:
              print(f"WARNING: {dupes} duplicate event_id(s) — legacy region, non-fatal")

          fatal = []
          if new_bad_json:
              fatal.append(f"{len(new_bad_json)} NEW malformed JSON line(s): {new_bad_json[:5]}")
          if new_broken:
              fatal.append(f"{len(new_broken)} NEW broken link(s): {new_broken[:3]}")

          if fatal:
              print("\n❌ VAULT INTEGRITY FAILURE — new corruption detected:")
              for f in fatal:
                  print(f"  {f}")
              print("\nIf this is verified legacy damage, extend the frozen exception")
              print("sets at the top of this script ONLY with F13 ratification + a")
              print("tombstone-manifest entry. Never rewrite the ledger in place.")
              sys.exit(1)

          print(f"✅ VAULT INTACT — {len(lines)} entries, no new corruption "
                f"(legacy damage: {legacy_bad_json} bad JSON + {legacy_broken} broken links, F13-documented)")
          PY

      - name: Verify outcomes.jsonl is valid JSONL
        run: |
          python3 - <<'PY'
          import json, sys

          VAULT_FILE = "VAULT999/outcomes.jsonl"

          try:
              with open(VAULT_FILE) as f:
                  lines = [l.strip() for l in f if l.strip()]
          except FileNotFoundError:
              print(f"SKIP: {VAULT_FILE} not present in repo checkout")
              sys.exit(0)

          errors = []
          for i, raw in enumerate(lines, 1):
              try:
                  json.loads(raw)
              except json.JSONDecodeError as e:
                  errors.append(f"Line {i}: invalid JSON — {e}")

          if errors:
              print(f"❌ outcomes.jsonl has {len(errors)} corrupt line(s):")
              for e in errors: print(f"  {e}")
              sys.exit(1)

          print(f"✅ outcomes.jsonl valid — {len(lines)} entries")
          PY
