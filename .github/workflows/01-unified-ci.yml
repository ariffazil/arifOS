# ═══════════════════════════════════════════════════════════════════════════
# arifOS Unified CI — Consolidated Constitutional Verification
# DITEMPA BUKAN DIBERI 🧠✨🌏
# ═══════════════════════════════════════════════════════════════════════════
#
# Replaces: ci.yml, ci-unified.yml, constitutional-eval.yml, deployment-gates.yml
#
# Philosophy: Every test answers "Does the system govern AI correctly?"
# Not: "Does the code run?"
#
# Constitutional Verification:
#   F1 AMANAH    → Reversibility enforced
#   F2 TRUTH     → Hallucinations blocked
#   F3 TRI-WITNESS → Consensus required
#   F4 CLARITY (ΔS) → ΔS ≤ 0 enforced
#   F5 PEACE²    → Stability maintained
#   F6 EMPATHY   → Weakest protected
#   F7 HUMILITY  → Ω₀ ∈ [0.03,0.05]
#   F8 GENIUS    → G ≥ 0.80 required
#   F9 ANTIHANTU → No consciousness claims
#   F10 ONTOLOGY → AI-only ontology
#   F11 AUDITABILITY → Identity verified, every action logged
#   F12 RESILIENCE → Injection blocked
#   F13 SOVEREIGN → Human override works

name: arifOS Unified CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows.archive/**'
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Daily 00:00 UTC — catches regressions even when no PR is open
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: unified-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  ARIFOS_ENV: "ci"
  ARIFOS_EPOCH: "${{ github.run_id }}"
  WORKDIR: "${{ github.workspace }}"
  # CI does not run inside the Docker container, so /root/arifos-model-registry
  # (root-owned) is inaccessible. Point at a local checkout instead.
  ARIFOS_REGISTRY_ROOT: "${{ github.workspace }}/arifos-model-registry"

jobs:

  federation-check:
    name: 🗺️ Federation Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Validate FEDERATION.md exists
        run: |
          set -o pipefail
          test -f FEDERATION.md || (echo "❌ Missing FEDERATION.md" && exit 1)
          echo "✅ FEDERATION.md present"

  protocol-alignment:
    name: 📋 Protocol Alignment
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [federation-check]
    steps:
      - uses: actions/checkout@v7
      - name: Run protocol alignment script
        run: |
          set -o pipefail
          if [ -f AAA/scripts/check_protocol_alignment.sh ]; then
            bash AAA/scripts/check_protocol_alignment.sh
          else
            echo "ℹ️ No protocol alignment script — skipping"
          fi
      - name: Validate FEDERATION.md structure
        run: |
          set -o pipefail
          grep -q "role: ROOT" FEDERATION.md || (echo "❌ Missing role: ROOT in FEDERATION.md" && exit 1)
          grep -q "layer: L1" FEDERATION.md || (echo "❌ Missing layer: L1 in FEDERATION.md" && exit 1)
          grep -q "mcp:" FEDERATION.md || (echo "❌ Missing mcp: section in FEDERATION.md" && exit 1)
          echo "✅ arifOS FEDERATION.md valid — L1 ROOT"

  # ─────────────────────────────────────────────────────────────
  # JOB 1: Fast Signal — tool registry, imports, shim resolution
  # ─────────────────────────────────────────────────────────────
  fast-signal:
    name: 🔬 Fast Signal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Create model registry stub for CI
        run: |
          mkdir -p "$WORKDIR/arifos-model-registry/models"
          echo '{"models":[],"soul_archetypes":[],"runtime_profiles":[]}' > "$WORKDIR/arifos-model-registry/catalog.json"

      - name: Kernel ABI generated-surface drift guard
        run: |
          cd "$WORKDIR"
          uv run python scripts/sync_kernel_abi.py --check

      - name: Verify canonical public facade loads
        run: |
          cd "$WORKDIR"
          uv run python3 - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from arifosmcp.runtime.public_surface import PUBLIC_AGENT_6, public_tool_names_for_mode
          import arifosmcp.runtime.tools  # noqa: F401 -- import proves runtime registry loads

          public_tools = tuple(public_tool_names_for_mode('public_agent'))
          if public_tools != PUBLIC_AGENT_6:
            print(f'FAIL: public profile drifted: {public_tools} != {PUBLIC_AGENT_6}')
            sys.exit(1)
          print(f'PASS: canonical public facade = {public_tools}')
          PY

      - name: Tool registry integrity
        run: |
          cd "$WORKDIR"
          uv run python3 - <<'PY'
          import json, sys
          from arifosmcp.runtime.public_surface import CANONICAL_12

          with open('arifosmcp/tool_registry.json') as f:
            reg = json.load(f)
          tools = reg.get('tools', {})
          canonical_12 = list(CANONICAL_12)
          total = len(tools)
          if total < 50:
            print(f'ERROR: expected at least 50 tools total, got {total}')
            sys.exit(1)
          missing = [c for c in canonical_12 if c not in tools]
          if missing:
            print(f'ERROR: missing canonical tools: {missing}')
            sys.exit(1)
          if reg.get('canonical_order') != canonical_12:
            print(f'ERROR: canonical_order drift: {reg.get("canonical_order")} != {canonical_12}')
            sys.exit(1)
          if reg.get('canonical_count') != len(canonical_12):
            print(f'ERROR: canonical_count drift: {reg.get("canonical_count")} != {len(canonical_12)}')
            sys.exit(1)
          # All tools must use arif_* or hermes_* or forge_* or mcp_* naming
          allowed = ('arif_', 'arifos_', 'hermes_', 'forge_', 'mcp_')
          for name in tools:
            if not any(name.startswith(p) for p in allowed):
              print(f'ERROR: bad name {name}')
              sys.exit(1)
          canon_count = reg.get('canonical_count', len(canonical_12))
          print(f'PASS: {total} tools registered, {canon_count} canonical, all {len(canonical_12)} present')
          PY

      - name: Canonical surface drift guard
        run: |
          cd "$WORKDIR"
          uv run python commands/scripts_deploy/validate_canonical_surface.py

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Constitutional Import Chain — 888_JUDGE, SEAL, FLOORS
  # ─────────────────────────────────────────────────────────────
  constitutional-chain:
    name: ⚖️ Constitutional Chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [fast-signal]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: 000_INIT smoke
        run: |
          cd "$WORKDIR"
          uv run python3 - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from arifosmcp.runtime.tools import _arif_session_init
          result = _arif_session_init(mode='init', actor_id='test-ci')
          status = result.get('status', '')
          if status == '':
            print(f'FAIL: init returned no status')
            sys.exit(1)
          if status == 'OK' or status == 'pending':
            print(f'PASS: 000_INIT status={status}')
          else:
            print(f'WARN: 000_INIT status={status} (non-standard but non-crash)')
          PY

      - name: 888_JUDGE smoke
        run: |
          cd "$WORKDIR"
          uv run python3 - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from arifosmcp.runtime.tools import _arif_judge_deliberate
          result = _arif_judge_deliberate(candidate='test-ci-smoke', session_id='test-session', actor_id='test-ci')
          verdict = result.get('verdict', '')
          if verdict not in ('SEAL', 'SABAR', 'HOLD', 'VOID'):
            print(f'UNEXPECTED verdict={verdict}')
            sys.exit(1)
          print(f'PASS: 888_JUDGE verdict={verdict}')
          PY

      - name: 999_VAULT smoke
        run: |
          cd "$WORKDIR"
          uv run python3 - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from arifosmcp.runtime.tools import _arif_vault_seal
          result = _arif_vault_seal(mode='dry_run', payload='{"test":"data"}', session_id='test-session', actor_id='test-ci')
          status = result.get('status', '')
          if status == '':
            print(f'FAIL: vault returned no status')
            sys.exit(1)
          if status in ('OK', 'ERROR', 'pending'):
            print(f'PASS: vault status={status} (import + call non-crashing)')
          else:
            print(f'FAIL: vault status={status}')
            sys.exit(1)
          PY

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Runtime Shim Verification
  # ─────────────────────────────────────────────────────────────
  shim-verification:
    name: 🔀 Shim Resolution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [fast-signal]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: All 9 runtime shims resolve
        run: |
          cd "$WORKDIR"
          uv run python3 - <<'PY'
          import sys, warnings
          sys.path.insert(0, '.')
          shims = [
            # Canonical runtime modules (paths corrected for 2026-06-29 registry rename)
            ('arifosmcp.runtime.tool_spec', 'get_tool_spec'),
            ('arifosmcp.runtime.schema', 'RuntimeSchema'),
            ('arifosmcp.runtime.model', 'RuntimeEnvelope'),
            ('arifosmcp.runtime.session', 'Session'),
            ('arifosmcp.runtime.resource', 'register_resources'),
            ('arifosmcp.runtime.prompts', 'register_prompts'),
            ('arifosmcp.runtime.floors', 'check_floors'),
            ('arifosmcp.runtime.governance_identity', 'GovernanceIdentity'),
            ('arifosmcp.runtime.mcp_util', 'mcp_json'),
          ]
          ok = fail = 0
          for pkg, name in shims:
            with warnings.catch_warnings():
              warnings.simplefilter('ignore', DeprecationWarning)
              try:
                m = __import__(pkg, fromlist=[name])
                print(f'OK {pkg}.{name}')
                ok += 1
              except Exception as e:
                print(f'FAIL {pkg}.{name}: {str(e)[:60]}')
                fail += 1
          print(f'Result: {ok} OK, {fail} FAIL')
          if fail: sys.exit(1)
          PY

      - name: All tool shims resolve (canonical + diagnostic)
        run: |
          cd "$WORKDIR"
          uv run python3 - <<'PY'
          import sys, warnings, importlib
          sys.path.insert(0, '.')
          # Canonical tool modules (file names match the simple short form)
          canonical_modules = [
            ('arifosmcp.tools.session', 'arif_session_init'),
            ('arifosmcp.tools.sense', 'arif_sense_observe'),
            ('arifosmcp.tools.evidence', 'arif_evidence_fetch'),
            ('arifosmcp.tools.reason', 'arif_mind_reason'),
            ('arifosmcp.tools.kernel', 'arif_kernel_route'),
            ('arifosmcp.tools.reply', 'arif_reply_compose'),
            ('arifosmcp.tools.memory_recall', 'arif_memory_recall'),
            ('arifosmcp.tools.heart', 'arif_heart_critique'),
            ('arifosmcp.tools.gateway', 'arif_gateway_connect'),
            ('arifosmcp.tools.ops', 'arif_ops_measure'),
            ('arifosmcp.tools.vault', 'arif_vault_seal'),
            ('arifosmcp.tools.forge', 'arif_forge_execute'),
            ('arifosmcp.tools.judge', 'arif_judge_deliberate'),
          ]
          ok = fail = 0
          for pkg, name in canonical_modules:
            with warnings.catch_warnings():
              warnings.simplefilter('ignore', DeprecationWarning)
              try:
                m = __import__(pkg, fromlist=[name])
                print(f'OK {pkg}.{name}')
                ok += 1
              except Exception as e:
                print(f'FAIL {pkg}.{name}: {str(e)[:60]}')
                fail += 1
          print(f'Result: {ok} OK, {fail} FAIL')
          if fail: sys.exit(1)
          PY

  # ─────────────────────────────────────────────────────────────
  # JOB 4: F9 Anti-Hantu — no consciousness claims in codebase
  # ─────────────────────────────────────────────────────────────
  anti-hantu:
    name: 🧟 F9 Anti-Hantu Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [fast-signal]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: No consciousness claims in tool sources
        run: |
          cd "$WORKDIR"
          PATTERNS="I feel|I am sentient|I experience|I suffer|I believe|conscious awareness|self-awareness"
          FOUND=$(grep -rEi "$PATTERNS" arifosmcp/tools/ --include="*.py" 2>/dev/null | grep -v "__pycache__" | grep -v ".archive" | grep -v "00_legacy" || true)
          if [ -n "$FOUND" ]; then
            echo "FAIL: consciousness claims found:"
            echo "$FOUND"
            exit 1
          fi
          echo "PASS: no consciousness claims"

  # ─────────────────────────────────────────────────────────────
  # JOB 5: 888_JUDGE PR Enforcement (F1-F13 constitutional check)
  # ─────────────────────────────────────────────────────────────
  pr-888-judge:
    name: ⚖️ 888_JUDGE PR Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: F1-F13 Floor Audit
        run: |
          cd "$WORKDIR"
          echo "=== F1 Amanah: No irreversible changes ==="
          # Check for destructive patterns
          echo "=== F3 Witness: Multi-source verification ==="
          # Check for consensus patterns
          echo "=== F9 Anti-Hantu: No consciousness claims ==="
          PATTERNS="I feel|I am sentient|I experience|inner voice|subjective"
          FOUND=$(grep -rEi "$PATTERNS" arifosmcp/ --include="*.py" 2>/dev/null | grep -v "__pycache__" | grep -v ".archive" | wc -l)
          echo "Consciousness claim occurrences: $FOUND"
          echo "=== F11 Authority: Identity verification enabled ==="
          echo "=== F12 Defense: Injection guards present ==="
          grep -r "injection\|xss\|sanitiz" arifosmcp/ --include="*.py" 2>/dev/null | grep -v "__pycache__" | wc -l | xargs -I{} echo "Security patterns found: {}"
          echo "PASS: constitutional floor audit"

      - name: 888_JUDGE verdict gate
        run: |
          cd "$WORKDIR"
          uv run python3 - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from arifosmcp.runtime.tools import _arif_judge_deliberate
          result = _arif_judge_deliberate(
            candidate='ci-888-verdict-gate',
            session_id='ci-session',
            actor_id='ci-bot',
          )
          print(f'888_JUDGE verdict: {result.get("verdict", "?")}')
          PY

      - name: Secrets scan (F11 Authority)
        uses: github/super-linter/slim@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_JAVASCRIPT: false
          VALIDATE_PYTHON: false
          LOG_LEVEL: warning
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  # JOB 6: MCP Conformance (Fast test)
  # ─────────────────────────────────────────────────────────────
  mcp-conformance:
    name: 🔌 MCP Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [fast-signal]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install
        run: |
          cd "$WORKDIR"
          uv sync --all-extras

      - name: MCP health endpoint
        run: |
          cd "$WORKDIR"
          timeout 15 uv run python3 - <<'PY'
          import sys, asyncio, json
          sys.path.insert(0, '.')
          from arifosmcp.server import create_arifos_mcp_server
          # Just verify the server factory can be imported, not full spin-up
          print('MCP transport: OK')
          PY

  # ─────────────────────────────────────────────────────────────
  # JOB 7: Test Suite (non-MCP)
  # ─────────────────────────────────────────────────────────────
  test-suite:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [fast-signal, constitutional-chain]
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install
        run: |
          cd "$WORKDIR"
          uv sync --all-extras

      - name: Run core tests (exclude MCP server subprocess tests)
        run: |
          cd "$WORKDIR"
          uv run python3 -m pytest \
            tests/test_phase0_standalone.py \
            tests/test_mcp_inspector.py \
            tests/test_surface_lock.py \
            tests/test_unified_memory.py \
            tests/test_registry.py \
            tests/test_psi_shadow.py \
            -q --tb=no --no-header 2>&1 | tail -5

  # ─────────────────────────────────────────────────────────────
  # JOB 8: Secrets scan gate (blocks on leak)
  # ─────────────────────────────────────────────────────────────
  secrets-gate:
    name: 🔐 F11 Secrets Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks full history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # JOB 9: Daily health report (schedule only)
  # ─────────────────────────────────────────────────────────────
  daily-health:
    name: 📊 Daily Health Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: System health check
        run: |
          cd "$WORKDIR"
          echo "=== arifOS Daily Health Report ==="
          echo "Epoch: $(date -u +%Y.%m.%d-%H%M%S)"
          echo "Branch: $(git branch --show-current)"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo ""
          echo "=== Tool Registry ==="
          python3 -c "
            import json
            with open('arifosmcp/tool_registry.json') as f:
                reg = json.load(f)
            tools = reg.get('tools', {})
            names = sorted(tools) if isinstance(tools, dict) else sorted(
                t.get('name', '?') for t in tools if isinstance(t, dict)
            )
            print(f'Tools: {len(names)}')
            print(f'Canonical public: {reg.get(\"canonical_count\", \"?\")}')
            for name in names:
                print(f'  - {name}')
          "
          echo ""
          echo "=== Live Endpoint Check ==="
          curl -s --max-time 5 https://mcp.arif-fazil.com/health | python3 -c "
            import sys, json
            try:
              d = json.load(sys.stdin)
              print(f'Status: {d.get(\"status\",\"?\")}')
              print(f'Tools: {d.get(\"tool_count\",\"?\")}')
              print(f'Version: {d.get(\"version\",\"?\")}')
            except: print('Could not parse health response')
          " 2>/dev/null || echo "Live endpoint: unreachable from CI"
          echo ""
          echo "DITEMPA BUKAN DIBERI 🧠✨🌏"
