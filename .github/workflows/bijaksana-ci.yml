# BIJAKSANA CI — Physics-Grounded Intelligence Gate
# Every push: ΔS ≤ 0, Φ ≥ 0.90, Ψ = MANIFEST, Ω = LOCKED
#
# ΔS = entropy delta (dead code, unused imports, TODOs)
# Φ  = clarity score (ruff pass rate)
# Ψ  = truth (surface = manifest)
# Ω  = governance (no self-auth, no creep)

name: BIJAKSANA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    if: github.actor != 'dependabot[bot]' && github.actor != 'app/dependabot'
    name: "ΔS Φ Ψ Ω"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install ruff -q

      - name: "ΔS — Entropy delta"
        id: ds
        run: |
          # Measure only NEW entropy introduced by this push.
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- '*.py' 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            F401=0; F541=0; TODO=0
          else
            F401=$(ruff check --select F401 --output-format json $CHANGED 2>/dev/null | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
            F541=$(ruff check --select F541 --output-format json $CHANGED 2>/dev/null | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
            TODO=$(echo "$CHANGED" | xargs grep -H "TODO\|FIXME\|HACK" 2>/dev/null | wc -l || echo 0)
          fi
          DS=$((F401 + F541 + TODO))
          echo "value=$DS" >> $GITHUB_OUTPUT
          echo "ΔS = F401($F401) + F541($F541) + TODO($TODO) = $DS"

      - name: "Φ — Clarity"
        id: phi
        run: |
          # File-level pass rate: files with zero ruff violations / total Python files.
          TOTAL=$(find . -name '*.py' | wc -l)
          if [ "$TOTAL" -eq 0 ]; then
            PHI=100
          else
            FILES_WITH_ERRORS=$(ruff check --output-format json . 2>/dev/null | python3 -c "import sys,json; print(len(set(v['filename'] for v in json.load(sys.stdin))))" 2>/dev/null || echo 0)
            PHI=$(( (TOTAL - FILES_WITH_ERRORS) * 100 / TOTAL ))
          fi
          echo "value=$PHI" >> $GITHUB_OUTPUT
          echo "Φ = $PHI%"

      - name: "Ψ — Truth"
        id: psi
        run: |
          if [ -f "arifosmcp/tool_registry.json" ]; then
            python3 -c "
          import json
          m = json.load(open('arifosmcp/tool_registry.json'))
          tools = len(m.get('tools', []))
          canonical = len(m.get('canonical_order', []))
          print(f'Ψ = {tools} tools, {canonical} canonical')
          print(f'canonical_order = {m.get(\"canonical_order\", [])}')
          "
            echo "value=ALIGNED" >> $GITHUB_OUTPUT
          else
            echo "Ψ = NO_MANIFEST"
            echo "value=MISSING" >> $GITHUB_OUTPUT
          fi

      - name: "Ω — Governance"
        id: omega
        run: |
          # Check: no NEW self-authorization logic introduced outside guards/tests/docs.
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- '*.py' 2>/dev/null || true)
          if [ -n "$CHANGED" ]; then
            SELF_AUTH=$(echo "$CHANGED" | xargs grep -HnE '\b(self_?authorize|self_?approve|self_?grant)\b' 2>/dev/null | grep -vE '(test_|benchmarks/|docs/|archive/|_guard|fiqh_agentik|no_executor_may_self_authorize)' | wc -l || echo 0)
          else
            SELF_AUTH=0
          fi
          CREEP=$(git diff HEAD~1 HEAD --stat 2>/dev/null | grep -c "server.py" || echo 0)
          MANIFEST=$(git diff HEAD~1 HEAD --stat 2>/dev/null | grep -cE 'tool_registry|manifest' || echo 0)

          if [ "$CREEP" -gt 0 ] && [ "$MANIFEST" -eq 0 ]; then
            echo "value=DRIFT" >> $GITHUB_OUTPUT
            echo "Ω = DRIFT (server changed, registry unchanged)"
          elif [ "$SELF_AUTH" -gt 0 ]; then
            echo "value=BREACH" >> $GITHUB_OUTPUT
            echo "Ω = BREACH (self-authorization detected in changed code)"
          else
            echo "value=LOCKED" >> $GITHUB_OUTPUT
            echo "Ω = LOCKED"
          fi

      - name: Verdict
        run: |
          echo "═══════════════════════════════════════"
          echo "BIJAKSANA REPORT"
          echo "═══════════════════════════════════════"
          echo "ΔS = ${{ steps.ds.outputs.value }}"
          echo "Φ  = ${{ steps.phi.outputs.value }}%"
          echo "Ψ  = ${{ steps.psi.outputs.value }}"
          echo "Ω  = ${{ steps.omega.outputs.value }}"
          echo ""

          DS=${{ steps.ds.outputs.value }}
          PHI=${{ steps.phi.outputs.value }}
          PSI=${{ steps.psi.outputs.value }}
          OMEGA=${{ steps.omega.outputs.value }}

          # Gate logic
          FAIL=0

          # ΔS gate: entropy must not spike
          if [ "$DS" -gt 100 ]; then
            echo "❌ ΔS=$DS (threshold: 100)"
            FAIL=1
          fi

          # Φ gate: clarity must be high
          if [ "$PHI" -lt 50 ]; then
            echo "❌ Φ=$PHI% (threshold: 50%)"
            FAIL=1
          fi

          # Ω gate: governance must be locked
          if [ "$OMEGA" = "BREACH" ]; then
            echo "❌ Ω=BREACH (self-authorization blocked)"
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "❌ BIJAKSANA FAILED — codebase entropy increased"
            exit 1
          else
            echo ""
            echo "✅ BIJAKSANA PASSED — intelligence maintained"
          fi
