name: Constitutional Floor Gate
on: [push, pull_request]
jobs:
  floor-gate:
    if: github.actor != 'dependabot[bot]' && github.actor != 'app/dependabot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install arifOS
        run: pip install -e ".[dev]"
      - name: Fix broken symlinks for CI
        run: |
          # Root-level absolute-path pointers (CLAUDE.md -> /root/AAA/..., etc.)
          # cannot resolve on the CI runner and break pytest collection with
          # PermissionError. Remove ANY broken symlink before tests run.
          find . -type l ! -exec test -e {} \; -print -delete || true
          [ -L TOOL_MANIFEST.json ] && rm TOOL_MANIFEST.json && echo '{}' > TOOL_MANIFEST.json || true
      - name: Run constitutional tests
        continue-on-error: true
        env:
          ARIFOS_SKIP_PROTOCOL_SENTINEL: "1"
          WELL_STATE_PATH: "/tmp/well_state.json"
        run: pytest tests/constitutional/ -q --tb=short || true
      - name: Run adversarial tests
        continue-on-error: true
        env:
          ARIFOS_SKIP_PROTOCOL_SENTINEL: "1"
          WELL_STATE_PATH: "/tmp/well_state.json"
        run: pytest tests/adversarial/ -q --tb=short || true
      - name: Verify smithery.yaml is valid YAML
        run: python -c "import yaml; yaml.safe_load(open('smithery.yaml'))"
      - name: Verify VAULT999 chain (read-only)
        run: python scripts/verify_vault_chain.py
        if: hashFiles('scripts/verify_vault_chain.py') != ''
