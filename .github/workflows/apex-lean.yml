name: apex-lean

on:
  push:
    paths:
      - "formal/**"
      - "lean-toolchain"
      - "lakefile.lean"
  pull_request:
    paths:
      - "formal/**"
      - "lean-toolchain"
      - "lakefile.lean"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Build formal artifact
        working-directory: ./formal
        run: lake build
      - name: Reject placeholders and custom axioms
        working-directory: ./formal
        run: |
          ! grep -RInE '\b(sorry|admit)\b' *.lean
          ! grep -RInE '^[[:space:]]*axiom[[:space:]]' *.lean
