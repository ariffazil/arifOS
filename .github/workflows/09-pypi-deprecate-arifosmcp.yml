name: One-off — deprecate PyPI arifosmcp (renamed to arifos)

# F13 directive 2026-10-15: retire the stale duplicate PyPI project `arifosmcp`
# (last release 2026.3.20) by publishing a final redirect-stub release.
# The current package is `arifos` (>= 1!2026.10.11). This workflow is safe to
# delete after the run. Auth: PYPI_API_TOKEN secret (same used by 07-publish).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - name: Build redirect stub
        run: |
          mkdir -p stub/arifosmcp
          cat > stub/pyproject.toml <<'EOF'
          [project]
          name = "arifosmcp"
          version = "1!2026.10.15"
          description = "MOVED: this project was renamed to 'arifos'. Install arifos >= 1!2026.10.11. This final release exists only to redirect the old name."
          requires-python = ">=3.10"
          [build-system]
          requires = ["hatchling"]
          build-backend = "hatchling.build"
          EOF
          cat > stub/arifosmcp/__init__.py <<'EOF'
          """Deprecated: renamed to 'arifos' (>= 1!2026.10.11)."""
          import warnings
          warnings.warn(
              "arifosmcp is DEPRECATED and renamed — `pip uninstall arifosmcp && pip install arifos`.",
              DeprecationWarning,
              stacklevel=2,
          )
          __version__ = "1!2026.10.15"
          EOF
          pipx run build stub
      - name: Publish final stub release
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: stub/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
