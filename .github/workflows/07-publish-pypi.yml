# ═══════════════════════════════════════════════════════════════════════════
# arifOS PyPI Publish — API Token auth (PYPI_API_TOKEN secret)
#
# Triggers on push to main when arifosmcp/pyproject.toml version changes,
# or manually via workflow_dispatch.
# ═══════════════════════════════════════════════════════════════════════════

name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
  workflow_dispatch:


permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-pypi
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor != 'dependabot[bot]' && github.actor != 'app/dependabot'
    name: Build and publish arifos
    runs-on: ubuntu-latest
    # NOTE: environment claim must EXACTLY match the PyPI trusted-publisher
    # registration. 2026-09-16: registration appears to have environment BLANK,
    # so the job-level environment line is removed (claim-absent matches blank).
    # If F13 later sets environment=pypi on pypi.org, re-add:
    #   environment: pypi
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # 2026-09-16 — OIDC TRUSTED PUBLISHING RESTORED (round 2).
          # F13 reconciled the pypi.org registration after the 4x
          # invalid-publisher failures; the 1!2026.9.1 upload that landed
          # went via the interim API-token lane (commit 9314253a7).
          # Registration environment = BLANK, so this workflow sends no
          # environment claim (matching shape). Rollback: restore
          # `password: ${{ secrets.PYPI_API_TOKEN }}` + `attestations: false`.
          attestations: true

  sbom:
    if: github.actor != 'dependabot[bot]' && github.actor != 'app/dependabot'
    name: CycloneDX SBOM (attach to release)
    runs-on: ubuntu-latest
    permissions:
      contents: write  # release asset upload (403 with workflow-level read)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv and sync
        run: pip install uv && uv sync
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p dist
          uv run python -c "from arifosmcp.arifos_sbom import generate_arifos_sbom, export_sbom_to_file as x; x(generate_arifos_sbom(), 'dist/arifos-sbom.cdx.json')"
          python3 -c "import json; d=json.load(open('dist/arifos-sbom.cdx.json')); print('SBOM components:', len(d.get('components', [])))"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: dist/arifos-sbom.cdx.json
      - name: Attach to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          if [ -n "$TAG" ]; then gh release upload "$TAG" dist/arifos-sbom.cdx.json --clobber && echo "attached to $TAG"; else echo "no release yet — artifact uploaded only"; fi
