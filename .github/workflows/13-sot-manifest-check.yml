name: 13-sot-manifest-check

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sot-manifest-check:
    if: github.actor != 'dependabot[bot]' && github.actor != 'app/dependabot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify README SOT-manifest live_commit matches git HEAD
        run: |
          set -euo pipefail

          # Stamp flow: update_readme_sot.py stamps at HEAD, the stamped README
          # rides the NEXT commit. live_commit == HEAD is impossible by
          # construction (fixed point); the checkable invariant is
          # live_commit == HEAD~1 (or == HEAD when the stamp commit itself is HEAD).
          README_COMMIT=$(grep 'live_commit:' README.md | head -1 | awk '{print $2}' | cut -c1-7)
          GIT_HEAD=$(git rev-parse --short=7 HEAD)
          GIT_HEAD_PREV=$(git rev-parse --short=7 HEAD~1)

          echo "README live_commit: $README_COMMIT"
          echo "git HEAD:           $GIT_HEAD"
          echo "git HEAD~1:         $GIT_HEAD_PREV"

          if [ "$README_COMMIT" != "$GIT_HEAD" ] && [ "$README_COMMIT" != "$GIT_HEAD_PREV" ]; then
            echo ""
            echo "❌ SOT MANIFEST DRIFT DETECTED"
            echo "   README claims: $README_COMMIT"
            echo "   Reality:       $GIT_HEAD or $GIT_HEAD_PREV"
            echo ""
            echo "Fix: run scripts/update_readme_sot.py at current HEAD and commit"
            echo "     the stamped README so it rides the next commit."
            exit 1
          fi

          echo "✅ SOT-manifest consistent: README live_commit matches git HEAD lineage"

      - name: Verify SOT-manifest last_verified is recent
        run: |
          set -euo pipefail

          LAST_VERIFIED=$(grep 'last_verified:' README.md | head -1 | awk '{print $2}' | cut -d'T' -f1)
          TODAY=$(date +%Y-%m-%d)

          echo "last_verified: $LAST_VERIFIED"
          echo "today:         $TODAY"

          DAYS_OLD=$(( ($(date -d "$TODAY" +%s) - $(date -d "$LAST_VERIFIED" +%s)) / 86400 ))

          if [ "$DAYS_OLD" -gt 7 ]; then
            echo "⚠️  SOT-manifest last_verified is $DAYS_OLD days old"
            echo "   Consider re-verifying and updating the timestamp."
          else
            echo "✅ last_verified is within 7 days"
          fi
