name: Federation Health Dashboard

on:
  schedule:
    - cron: "0 3 * * 1"  # Monday 03:00 UTC (11:00 MYT) — after per-repo digests
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read
  pull-requests: read

concurrency:
  group: federation-health
  cancel-in-progress: false

jobs:
  dashboard:
    if: github.actor != 'dependabot[bot]' && github.actor != 'app/dependabot'
    name: 🌐 Federation Health Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Build federation health report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          READ_TOKEN: ${{ secrets.FEDERATION_READ_TOKEN || secrets.GITHUB_TOKEN }}
          STALE_DAYS: "14"
        run: |
          set -euo pipefail
          WEEK=$(date -u +%Y-%m-%d)
          REPORT=federation-report.md

          ERRF=$(mktemp)
          run_gh() {
            RC=0
            OUT=$(GH_TOKEN="$READ_TOKEN" gh "$@" 2> "$ERRF") || RC=$?
            ERR=$(head -c 160 "$ERRF" | tr '\n\r\\|' '    ')
          }
          
          # ci_status <slug> -> sets CI_STATE (success|failure|stale|none|error) and CI_DETAIL
          ci_status() {
            local slug=$1 branch summary failed total age ids id runs
            run_gh repo view "$slug" --json defaultBranchRef --jq '.defaultBranchRef.name'
            if [ "$RC" -ne 0 ] || [ -z "$OUT" ]; then CI_STATE=error; CI_DETAIL="repo lookup failed: $ERR"; return; fi
            branch=$OUT

            run_gh workflow list --repo "$slug" --limit 1000 --json id --jq '.[].id'
            if [ "$RC" -ne 0 ]; then CI_STATE=error; CI_DETAIL="workflow list failed: $ERR"; return; fi
            ids=$OUT
            if [ -n "$ids" ] && [ "$(wc -l <<<"$ids")" -ge 1000 ]; then CI_STATE=error; CI_DETAIL="workflow list truncated at 1000"; return; fi
            
            runs="[]"
            for id in $ids; do
              run_gh run list --repo "$slug" --workflow "$id" --branch "$branch" --status completed --limit 20 \
                --json workflowName,conclusion,updatedAt \
                --jq '[.[] | select(.conclusion | IN("cancelled","skipped","neutral") | not)] | sort_by(.updatedAt) | last // empty'
              if [ "$RC" -ne 0 ]; then CI_STATE=error; CI_DETAIL="run list failed for workflow $id: $ERR"; return; fi
              [ -z "$OUT" ] && continue
              runs=$(jq -c -s '.[0] + [.[1]]' <<<"$runs"$'\n'"$OUT")
            done
            OUT=$runs

            summary=$(printf '%s' "$OUT" | jq -c '
            . as $w
            | { total: ($w | length),
                failed: [ $w[] | select(.conclusion | IN("failure","timed_out","startup_failure","action_required")) | .workflowName ],
                age: (now - ([ $w[].updatedAt | fromdateiso8601 ] | max // 0)) }')

            total=$(jq -r '.total' <<<"$summary")
            failed=$(jq -r '.failed | join(", ")' <<<"$summary")
            age=$(jq -r '.age | floor' <<<"$summary")

            if [ "$total" -eq 0 ]; then CI_STATE=none;    CI_DETAIL="no completed runs on $branch"
            elif [ -n "$failed" ]; then CI_STATE=failure; CI_DETAIL="failing on $branch: $failed"
            elif [ "$age" -gt $((STALE_DAYS * 86400)) ]; then CI_STATE=stale; CI_DETAIL="newest run on $branch is $((age / 86400))d old"
            else CI_STATE=success; CI_DETAIL="$total workflows green on $branch"
            fi
          }

          declare -A TIERS=( ["arifOS"]="infra" ["AAA"]="infra" ["A-FORGE"]="core"
            ["well"]="core" ["geox"]="core" ["wealth"]="core" ["arif-sites"]="site" )

          {
            echo "## 🌐 Federation Health — $WEEK"
            echo ""
            echo "| Repo | Tier | Last CI | Open PRs | Dependabot | Status |"
            echo "|---|---|---|---|---|---|"
          } > "$REPORT"

          ALL_GREEN=true
          ALERTS=""

          for repo_path in arifOS AAA A-FORGE well geox wealth arif-sites; do
            SLUG="ariffazil/$repo_path"
            TIER="${TIERS[$repo_path]:-unknown}"

            ci_status "$SLUG"

            OPEN_PRS="?"; DEP_PRS="?"; PR_ERR=""
            run_gh pr list --repo "$SLUG" --state open --limit 500 --json number --jq 'length'
            if [ "$RC" -eq 0 ]; then OPEN_PRS=$OUT; else PR_ERR=$ERR; fi
            run_gh pr list --repo "$SLUG" --state open --author "app/dependabot" --limit 500 --json number --jq 'length'
            if [ "$RC" -eq 0 ]; then DEP_PRS=$OUT; else PR_ERR=${PR_ERR:-$ERR}; fi

            case "$CI_STATE" in
              success) STATUS="✅ green" ;;
              failure) STATUS="🔴 FAIL";  ALL_GREEN=false; ALERTS="$ALERTS\n- $repo_path CI $CI_DETAIL" ;;
              stale)   STATUS="🕓 stale"; ALL_GREEN=false; ALERTS="$ALERTS\n- $repo_path CI stale: $CI_DETAIL" ;;
              none)    STATUS="⚪ no runs"; ALL_GREEN=false; ALERTS="$ALERTS\n- $repo_path CI: $CI_DETAIL" ;;
              *)       STATUS="⚠️ API error"; ALL_GREEN=false; ALERTS="$ALERTS\n- $repo_path CI not verified (collector error): $CI_DETAIL" ;;
            esac

            if [ "$OPEN_PRS" = "?" ] || [ "$DEP_PRS" = "?" ]; then
              ALL_GREEN=false
              [ "$CI_STATE" = "success" ] && STATUS="⚠️ incomplete observation" 
              ALERTS="$ALERTS\n- $repo_path PR counts unavailable: $PR_ERR"
            fi

            if [ "$DEP_PRS" != "?" ] && [ "$DEP_PRS" -gt 5 ]; then
              ALERTS="$ALERTS\n- $repo_path has $DEP_PRS Dependabot PRs open"
            fi

            echo "| \`$repo_path\` | $TIER | \`$CI_STATE\` | $OPEN_PRS | $DEP_PRS | $STATUS |" >> "$REPORT"
          done

          {
            echo ""
            if $ALL_GREEN; then
              echo "### ✅ All systems green"
            else
              echo "### ⚠️ Action required — see alerts below"
            fi
            echo ""
            echo "### Alerts"
            if [ -n "$ALERTS" ]; then
              printf "%b\n" "$ALERTS"
            else
              echo "_none_"
            fi
            echo ""
            echo "### Federation Ports"
            echo "| Service | Port | Tier |"
            echo "|---|---|---|"
            echo "| arifOS governance kernel | 8088 | infra |"
            echo "| AAA control plane | 80/443 | infra |"
            echo "| A-FORGE agent runtime | 7071 | core |"
            echo "| WELL substrate | 18083 | core |"
            echo "| GEOX earth engine | 8081 | core |"
            echo "| WEALTH capital engine | 18082 | package |"
            echo "| arif-sites | 443 | site |"
            echo ""
            echo "### Governance Checklist"
            echo "- [ ] All required checks passing on main"
            echo "- [ ] No stale Dependabot PRs > 14 days"
            echo "- [ ] No forbidden workflows (checked by 02-aaa-seal)"
            echo "- [ ] VAULT999 ledger: healthy"
            echo "- [ ] Hermes ASI: responsive on Telegram"
            echo ""
            echo "---"
            echo "_Auto-generated by \`federation-health.yml\` in \`ariffazil/arifOS\`_"
          } >> "$REPORT"

          gh issue create \
            --repo ariffazil/arifOS \
            --title "🌐 Federation Health — $WEEK" \
            --body-file "$REPORT" \
            --label "automation" || true

          echo "Dashboard issue created for $WEEK"
