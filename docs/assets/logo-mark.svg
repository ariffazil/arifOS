<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" font-family="DejaVu Sans, Liberation Sans, sans-serif">
  <!-- arifOS logo-mark: gate within a circle · three nodes (proposal / judgment / execution) ·
       gate between judgment and execution · upper mark = retained human authority -->
  <circle cx="256" cy="256" r="232" fill="#14161a"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#d4a853" stroke-width="10"/>

  <!-- upper mark: human authority -->
  <rect x="216" y="112" width="80" height="14" rx="7" fill="#d4a853"/>
  <line x1="256" y1="126" x2="256" y2="252" stroke="#d4a853" stroke-width="4" stroke-dasharray="7 6"/>

  <!-- connectors -->
  <line x1="182" y1="316" x2="236" y2="316" stroke="#4fd1c5" stroke-width="7"/>
  <line x1="300" y1="316" x2="330" y2="316" stroke="#d4a853" stroke-width="7"/>
  <line x1="372" y1="316" x2="384" y2="316" stroke="#4fd1c5" stroke-width="7"/>

  <!-- nodes: proposal · judgment · execution -->
  <circle cx="166" cy="316" r="24" fill="#4fd1c5"/>
  <circle cx="268" cy="316" r="30" fill="#d4a853"/>
  <circle cx="398" cy="316" r="24" fill="#4fd1c5"/>

  <!-- gate between judgment and execution -->
  <rect x="326" y="262" width="46" height="10" rx="4" fill="#d4a853"/>
  <rect x="328" y="272" width="9" height="72" rx="3" fill="#d4a853"/>
  <rect x="361" y="272" width="9" height="72" rx="3" fill="#d4a853"/>
</svg>
