# quote_registry_sot.yaml — Source of Truth for arifOS Quote Registry
#
# Pattern source: WEALTH/tools_sot.yaml (2026-07-18)
# Purpose: single declarative source for quote registry + wisdom envelope injection
# that flows dynamically to MCP tools. Replaces the previously-implicit
# quote_registry_v2.json as the canonical SOT for schema/contract; the JSON
# remains the data carrier (99 entries).
#
# Authoring rule: this file is regenerated from quote_registry_v2.json via
# tools/quote_registry_sot_gen.py. Do not hand-edit; edit the JSON.
#
# Reading order (federation-wide):
#   1. quote_registry_v2.json          ← DATA (99 quotes + 17 doctrine)
#   2. quote_registry_sot.yaml         ← THIS FILE — schema + injection contract
#   3. arifosmcp/runtime/quote_registry.py  ← RUNTIME (resolver + APEX math)
#   4. arifosmcp/resources/wisdom_resources.py  ← MCP RESOURCE surface
#
# Constitutional binding (2026-07-19):
#   - Quote entries classified into 4 tiers (kernel_motto / constitutional_axiom
#     / generated_reflection / sealed_canon) — see classification.tiers
#   - 17 council entries (COUNCIL_*) FORCED to DRAFT (Layer C)
#   - Only 555_HEART and 999_RECEIPT stages may carry quotes (Layer D)
#   - APEX fingerprint attached on every resolve (Layer A): G, C_dark, shadow_state
#   - Federation namespace URI: arifos://wisdom/{quote|doctrine}/{id} (Layer B)
#
# SOT-MANIFEST:
#   organ: arifOS
#   version: 2026.07.19
#   sot_source: arifosmcp/runtime/quote_registry.py
#   data_source: arifosmcp/data/quote_registry_v2.json
#   live_port: 8088
#   generator: tools/quote_registry_sot_gen.py
#   test: tests/test_quote_registry_v1.py + tests/test_forge_quote_invariance.py

organ: arifOS
version: 2026.07.19
sot_source: arifosmcp/runtime/quote_registry.py
data_source: arifosmcp/data/quote_registry_v2.json
