# Post-zen-consolidation sequence: 10 canonical sigil prompts.
# Legacy numeric aliases are registered for backward compat but NOT part
# of the canonical sequence (they route to sigil prompts internally).
canonical_sequence:
  - "🌱 BOOT"       # Session bootstrap — identity binding, floor acceptance
  - "🌊 WITNESS"    # Reality sensing — observation, pattern detection, evidence
  - "🧠 REASON"     # Cognitive engine — abduction (N≥3), synthesis, proposal
  - "⚖ MARUAH"     # Dignity check — consequence scan, blast radius, dignity
  - "🔍 PREFLIGHT"  # F1-F13 pre-operation check
  - "🔒 JUDGE"      # Constitutional verdict — 4 tests + F1-F13 matrix
  - "🔥 FORGE"      # Guarded execution — smallest reversible step + rollback
  - "💎 SEAL"       # VAULT999 close — append-only immutable record
  - "🌀 SABAR"      # Recursive governed loop orchestrator
  - "📜 REPLY"      # Governed AGI reply envelope

prompts:

  - id: "🌀 SABAR"
    semantic_name: "orchestrator"
    title: "🌀 SABAR — Recursive Governed Loop"
    description: "Governed 6-stage reality-loop template. Each linked tool retains its own authority gate; this prompt grants no judgment, execution, or seal authority. Supersedes arifosmcp_loop_engineer + recursive_governed_loop."
    floor_binding: ["L01", "L11"]
    inputs_schema:
      type: "object"
      required: ["intent"]
      properties:
        intent: { type: "string", minLength: 1, maxLength: 4096 }
        session_id: { type: "string" }
        depth: { enum: ["auto", "stage"], default: "stage" }
    expected_contracts:
      - "loop_classification returned"
      - "stage_history recorded"
      - "ΔS ≤ 0 per iteration"
    entropy_budget_tokens: 400

  - id: "🌱 BOOT"
    semantic_name: "anchor"
    title: "🌱 BOOT — Constitutional Bootstrap"
    description: "Identity binding, reality grounding, floor acceptance, cross-session memory load. 7-point self-check before any work. Supersedes 000_init + arif_init_prompt_v3."
    floor_binding: ["L01", "L11", "L12"]
    inputs_schema:
      type: "object"
      required: ["actor_id", "intent"]
      properties:
        actor_id: { type: "string", pattern: "^[a-zA-Z0-9_-]{3,64}$" }
        intent: { type: "string", minLength: 1, maxLength: 4096 }
        depth: { enum: ["boot", "full"], default: "boot" }
    expected_contracts:
      - "session_id returned"
      - "Q1-Q7 self-check completed"
      - "TRINITY-33 + RSI loaded"
    entropy_budget_tokens: 800

  - id: "🌊 WITNESS"
    semantic_name: "witness"
    title: "🌊 WITNESS — Reality Sensing (provenance-bound)"
    description: "Open observation, pattern detection, evidence gathering with provenance-bound epistemic labels (F2). Labels MUST originate at data ingress, not at model output. Calls arif_observe + geox_evidence + well_validate_vitality. Supersedes 111_sense."
    floor_binding: ["L02", "L03", "L07", "L12"]
    inputs_schema:
      type: "object"
      required: ["intent"]
      properties:
        intent: { type: "string", minLength: 1 }
        focus: { type: "string" }
    expected_contracts:
      - "evidence labeled OBS/DER/INT/SPEC with provenance_source, confidence, staleness_seconds"
      - "confidence capped at 0.90"
      - "WITNESS block returned with provenance fields per observation"
    entropy_budget_tokens: 600
    provenance:
      enabled: true
      requires: ["provenance_source", "confidence", "staleness_seconds"]
      rule: "Labels must originate at data ingress. Post-hoc model-generated labels → F2 VOID."

  - id: "🧠 REASON"
    semantic_name: "mind"
    title: "🧠 REASON — Hypothesis Engine"
    description: "Abstraction, abduction (N≥3 hypotheses), synthesis, proposal. Calls arif_think. F7 HUMILITY enforced. Supersedes 333_reason."
    floor_binding: ["L02", "L05", "L06", "L07", "L08", "L09", "L10"]
    inputs_schema:
      type: "object"
      required: ["witness_block"]
      properties:
        witness_block: { type: "string" }
        hypothesis_count: { type: "integer", minimum: 2, maximum: 7, default: 3 }
    expected_contracts:
      - "hypothesis_set returned (N≥2)"
      - "Ω₀ ∈ [0.03, 0.05] declared"
      - "REASON block returned"
    entropy_budget_tokens: 1200

  - id: "⚖ MARUAH"
    semantic_name: "mirror"
    title: "⚖ MARUAH — Dignity Check"
    description: "Consequence scan, blast radius, and dignity check. Uses arif_think(mode=critique) plus WELL evidence. κᵣ ≥ 0.70 required. Supersedes 555_critique."
    floor_binding: ["L05", "L06", "L12"]
    inputs_schema:
      type: "object"
      required: ["reason_block"]
      properties:
        reason_block: { type: "string" }
    expected_contracts:
      - "dignity_score returned"
      - "weakest_stakeholder identified"
      - "MARUAH block returned"
    entropy_budget_tokens: 800

  - id: "🔍 PREFLIGHT"
    semantic_name: "precheck"
    title: "🔍 PREFLIGHT — Constitutional Check"
    description: "Pre-operation F1-F13 floor check. Use BEFORE any irreversible action. Supersedes constitutional_pre_flight."
    floor_binding: ["L01", "L02", "L03", "L04", "L05", "L06", "L07", "L08", "L09", "L10", "L11", "L12", "L13"]
    inputs_schema:
      type: "object"
      required: ["operation"]
      properties:
        operation: { type: "string" }
    expected_contracts:
      - "per-floor verdict returned"
      - "remediation for failed floors"
    entropy_budget_tokens: 600

  - id: "🔒 JUDGE"
    semantic_name: "gate"
    title: "🔒 JUDGE — Constitutional Gate (provenance-aware)"
    description: "Constitutional verdict — four tests + F1-F13 floor matrix + provenance verification. SEAL/HOLD/SABAR/VOID. Any epistemic tag without a provenance trace → VOID. Calls arif_judge. Supersedes 666_judge."
    floor_binding: ["L01", "L02", "L11", "L13"]
    inputs_schema:
      type: "object"
      required: ["maruah_block"]
      properties:
        maruah_block: { type: "string" }
        candidate: { type: "string" }
        reversibility: { type: "string" }
        blast_radius: { type: "string" }
    expected_contracts:
      - "verdict returned (SEAL/SABAR/HOLD/VOID)"
      - "provenance_verified: true|false — did all labels trace to retrieval?"
      - "provenance_violations[] if any tag lacks provenance_source"
      - "violated_floors[] if not SEAL"
      - "JUDGE block returned"
    entropy_budget_tokens: 600
    provenance:
      enabled: true
      gate: "Any epistemic tag without provenance_source → VOID regardless of other floor results."

  - id: "🔥 FORGE"
    semantic_name: "hammer"
    title: "🔥 FORGE — Guarded Execution"
    description: "Structural enforcement gate. Execute smallest reversible step, verify AFTER state. Requires prior 🔒 JUDGE SEAL. Supersedes 777_forge."
    floor_binding: ["L01", "L11", "L13"]
    inputs_schema:
      type: "object"
      required: ["judge_block"]
      properties:
        judge_block: { type: "string" }
        seal_verdict_id: { type: "string" }
    expected_contracts:
      - "execution_receipt returned"
      - "FORGE block with audit trail"
      - "ΔS ≤ 0 verified"
    entropy_budget_tokens: 1000

  - id: "💎 SEAL"
    semantic_name: "fossil"
    title: "💎 SEAL — VAULT999 Record"
    description: "Golden path verification, immutable VAULT999 write, recursive MCP stack hardening. Terminal stage. Supersedes 999_seal."
    floor_binding: ["L01", "L11", "L13"]
    inputs_schema:
      type: "object"
      required: ["forge_block"]
      properties:
        forge_block: { type: "string" }
    expected_contracts:
      - "seal_id returned"
      - "chain_position returned"
      - "SEAL block returned"
    entropy_budget_tokens: 400

  - id: "📜 REPLY"
    semantic_name: "envelope"
    title: "📜 REPLY — Governed Reply Envelope"
    description: "TO/CC/TITLE/RACI/τ/floors/SEAL envelope for AGI replies. Supersedes agi_reply_protocol_v3."
    floor_binding: ["L01", "L02", "L04", "L06", "L07", "L09", "L10", "L11", "L12", "L13"]
    inputs_schema:
      type: "object"
      required: ["query"]
      properties:
        query: { type: "string" }
        recipient_id: { type: "string", default: "human" }
    expected_contracts:
      - "TO/CC/TITLE header"
      - "RACI block"
      - "τ truth score"
      - "floor tags"
    entropy_budget_tokens: 400

