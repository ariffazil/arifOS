      - tool manifest
      - tools/list
      - tools/call
      - capability surface
      - capability lease
      # Governance / constitutional
      - kernel health
      - kernel status
      - kernel route
      - kernel attest
      - arifos kernel
      - arifos health
      - arifos status
      - constitutional floor
      - constitutional check
      - governance check
      - governance status
      - federation health
      - federation healthy
      - seal boundary
      - seal verdict
      - authority envelope
      - epistemic tag
      - cognitive axis
      # Session / memory / vault
      - initialize session
      - session init
      - session anchor
      - memory recall
      - memory search
      - vault seal
      - vault ledger
      - lease request
      - belief state
      - runtime schema
      # Canonical tool names (explicit arif_* queries)
      - arif init
      - arif route
      - arif triage
      - arif judge
      - arif seal
      - arif measure
      - arif observe
      - arif think
      - arif critique
      - arif bridge
      - arif gateway
      - arif forge
      - arif_forge
      - arif memory
      - arif_memory
      - arif session
      - arif vault
      # Federation
      - federation contract
      - federation manifest
      - organ attestation
      - organ health
      - agentic search
      - agent registry
      # Sovereign / personal decisions (original arifos domain)
      - life roadmap
      - career decision
      - personal decision
      - what should i do
      - life direction
      - should i leave
      - should i stay
      - human sovereign
      - sovereign decision
      - life choice
      - exit strategy
      - what do i want
      - my future
    organ: arifOS
    port: 8088
    tool_prefix: arifos_

