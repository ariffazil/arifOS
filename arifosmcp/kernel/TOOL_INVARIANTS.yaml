  version: "1.0.0-2026.07.05"
  forged: "2026-07-05"
  sovereign: "ARIF_FAZIL"
  bands:
    "000": "000 INIT — session bootstrap"
    "111": "111 SENSE — observation, fetch, memory"
    "333": "333 REASON — think, route, measure"
    "555": "555 CRITIQUE — ethical risk, dignity"
    "666": "666 JUDGE — constitutional verdict"
    "777": "777 FORGE — execution prep + act"
    "999": "999 SEAL — vault seal + compose"
  # band.slot → K-series id
