    "999.1": { k_id: K010, name: arif_seal }
    "999.2": { k_id: K011, name: arif_compose }
  # name → harmonic_id (for UI/explainer surfaces)
  by_name:
    arif_init: "000.1"
    arif_observe: "111.1"
    arif_fetch: "111.2"
    arif_memory: "111.3"
    arif_think: "333.1"
    arif_route: "333.2"
    arif_measure: "333.3"
    arif_critique: "555.1"
    arif_judge: "666.1"
    arif_judge_deliberate: "666.2"
    arif_forge: "777.1"
    arif_act: "777.2"
    arif_seal: "999.1"
    arif_compose: "999.2"
  reserved_slots:
    "000.2": "reserved for future 000-stage bootstrap tool"
    "888.0": "reserved for sovereign-judgment stage (not yet active)"

