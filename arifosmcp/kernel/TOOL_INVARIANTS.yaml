# ─── HARMONIC INDEX (Stage 1 — 2026-07-05) ──────────────────────────────────
# band.slot identity for canonical kernel tools only.
# 8 bands × slots 1..N per band. Diagnostics reference canonical IDs.
#
# WHY: K-series numbers (K001..K014) are stable internal IDs but opaque to
# humans. harmonic_id (e.g. 111.2) is the public-facing identifier that
# mirrors the 7-stage governance pipeline and is what sovereign + review
# surfaces should display.
#
# Schema: "band.slot" where band ∈ {000, 111, 333, 555, 666, 777, 999}
# and slot is the tool's position within its band (1-indexed).
#
# Resolution rules (see tool_id_resolver.py):
#   - name (e.g. "arif_fetch")        → K-series id
#   - K-series id (e.g. "K012")        → harmonic_id
#   - harmonic_id (e.g. "111.2")       → name
#   - any of the above                  → all three
#
# Deprecated names (e.g. arif_sense_observe) keep working via the
# `deprecated_aliases` block below. No K-series id is ever reused.

