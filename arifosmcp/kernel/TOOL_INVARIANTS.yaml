    "000.1": { k_id: K001, name: arif_init }
    "111.1": { k_id: K002, name: arif_observe }
    "111.2": { k_id: K012, name: arif_fetch }
    "111.3": { k_id: K014, name: arif_memory }
    "333.1": { k_id: K003, name: arif_think }
    "333.2": { k_id: K004, name: arif_route }
    "333.3": { k_id: K013, name: arif_measure }
    "555.1": { k_id: K005, name: arif_critique }
    "666.1": { k_id: K006, name: arif_judge }
    "666.2": { k_id: K007, name: arif_judge_deliberate }
    "777.1": { k_id: K008, name: arif_forge }
