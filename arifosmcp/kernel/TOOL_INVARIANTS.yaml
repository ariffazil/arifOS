#
# PURPOSE: Single source of truth for kernel tool identity.
#   - Each tool gets a fixed number (K001, K002, ...).
#   - Numbers are IMMUTABLE once assigned. Tools can be added (K015, K016...)
#     but never renumbered or reused.
#   - Aliases are listed but do not get their own number.
#   - Diagnostic tools get D001, D002, ...
#   - This file is the CONSTITUTION of the tool surface.
#
# WHY: The health endpoint reports 6 different tool counts depending on
#   which observer is counting. That is chaos. This file ends it.
#
# RULES:
#   1. To add a tool: append with next number. Never insert.
#   2. To deprecate a tool: set status=deprecated. Never remove the line.
#   3. To alias a tool: add to the aliases list of the canonical tool.
#   4. Every tool in this file MUST have a handler registered somewhere.
#   5. Every handler registered MUST appear in this file.
#
# FORGED: 2026-07-05 by FORGE (000Ω) under F13 SOVEREIGN
# DITEMPA BUKAN DIBERI
# ═══════════════════════════════════════════════════════════════════════════════

