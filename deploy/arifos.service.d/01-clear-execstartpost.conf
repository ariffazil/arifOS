; arifos.service.d/01-clear-execstartpost.conf
; ════════════════════════════════════════════════════════════════════
; Tracked systemd drop-in template for arifos.service.
;
; PURPOSE
;   Override the upstream ``ExecStartPost=`` directive so arifOS no
;   longer tries to call ``/usr/local/bin/arifos-post-start`` (or any
;   other post-start hook) on boot.  The recovery plan retired the
;   in-service auto-registration path; production auto-registration
;   now lives on the AAA side (``AAA/a2a-server/auto-register-organs.js``)
;   with bounded readiness probes.
;
; INSTALL (operator-only, NOT automated by this recovery commit):
;
;   sudo install -d /etc/systemd/system/arifos.service.d
;   sudo install -m 0644 \
;       /root/arifOS/deploy/arifos.service.d/01-clear-execstartpost.conf \
;       /etc/systemd/system/arifos.service.d/01-clear-execstartpost.conf
;   sudo systemctl daemon-reload
;   sudo systemctl restart arifos.service
;
; WHY A DROP-IN, NOT A REWRITE
;   The drop-in mechanism lets us change ONE directive without touching
;   the upstream unit file in /etc/systemd/system/arifos.service.  This
;   keeps the kernel envelope (F1) small: the only mutating op is a
;   install + daemon-reload + restart, performed by a human under F13.
;
; SAFETY
;   * Empty value for ``ExecStartPost=`` clears the directive.  Verified
;     against systemd.exec(5) §"Command Lines" — an empty assignment
;     resets the list to its inherited default of "none".
;   * If the upstream unit file ever changes, this drop-in still wins
;     because drop-ins are applied LAST (lowest precedence first).
;
; SCOPE
;   Only ``[Service]`` section directives are overridden here.  All
;   other unit options (Unit, Install) remain inherited from upstream.
;
; DITEMPA BUKAN DIBERI — Forged, Not Given (2026-07-22)

[Service]
# Clear all upstream ExecStartPost directives.  Empty assignment resets
# the list per systemd.exec(5).  Production auto-registration is on the
# AAA side; no per-organ post-start hook is needed in arifOS itself.
ExecStartPost=
