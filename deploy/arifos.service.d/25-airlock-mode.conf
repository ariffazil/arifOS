# 2026-09-28 · FI-003 · L3 airlock out of shadow (smallest honest rung).
# partial_enforce blocks only read-like actions that already carry a transport
# error (airlock.py:756-758 + should_partial_enforce); enforce is the declared
# target once shadow_would_block/partial_enforced are reviewed from real traffic.
# Rollback: set mode back to shadow here, then `systemctl restart arifos.service`.
[Service]
Environment=ARIF_AIRLOCK_MODE=partial_enforce
Environment=ARIFOS_MCP_REQUIRE_VERSION=0
# Emergency: ARIF_AIRLOCK_MODE=off disables the middleware entirely (airlock.py:643)
# Emergency: ARIFOS_MCP_REQUIRE_VERSION=0 restores versionless POST acceptance
