; arifos.service.d/02-fhs-canon.conf
; ════════════════════════════════════════════════════════════════════
; FHS canon plane (2026-09-16) — /etc/arifos/canon formalization.
;
; - ConfigurationDirectory=arifos : systemd owns /etc/arifos lifecycle
; - ARIFOS_CANON_DIR              : kernel reads ratified authority
;                                   (arifosmcp/canon.py — sole resolver)
; - ProtectHome=read-only         : kernel may READ /root assets but
;   can never WRITE into the dev tree (G7 immutability, middle step —
;   full ProtectHome=yes still deferred behind Fasa 2 ExecStartPost
;   refactor, same as ProtectSystem=strict).
;
; Canon files are installed root:root 0644 by deploy-release.sh Step
; 5-pre — the ONLY writer. Service user reads, never writes.
;
; INSTALL (operator):
;   sudo install -m 0644 \
;       /root/arifOS/deploy/arifos.service.d/02-fhs-canon.conf \
;       /etc/systemd/system/arifos.service.d/02-fhs-canon.conf
;   sudo systemctl daemon-reload && sudo systemctl restart arifos.service
; ════════════════════════════════════════════════════════════════════

[Service]
ConfigurationDirectory=arifos
Environment=ARIFOS_CANON_DIR=/etc/arifos/canon
ProtectHome=read-only
