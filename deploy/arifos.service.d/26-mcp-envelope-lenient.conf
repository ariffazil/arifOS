# 2026-10-08 — External connector compatibility (Glama health-check fix, F13 directive)
#
# Symptom: external MCP directory connector (Glama) failed hourly connect+tools/list
# check against https://mcp.arif-fazil.com/mcp. Measured server-side cause: any client
# declaring MCP-Protocol-Version: 2026-07-28 without the Mcp-Method (and tools/call
# Mcp-Name) headers is hard-rejected 400 HeaderMismatch by the G0.7 strict envelope
# ratchet (ARIFOS_MCP_ENVELOPE_STRICT default=1). Federation callers never omit these
# headers; external directory clients do — that population was not measured when the
# ratchet tightened (see runtime/mcp_transport_bridge.py).
#
# Effect of =0 (the in-code kill-switch): lenient pass WITH warning log per request,
# so re-ratcheting can later be driven by measured external traffic. Header↔_meta
# conflict checks (G0.7 coherence) and G10 version gate remain as configured.
#
# Rollback: delete this file, then `systemctl daemon-reload && systemctl restart arifos`.
# SOT mirror: /root/arifOS/deploy/arifos.service.d/26-mcp-envelope-lenient.conf

[Service]
Environment=ARIFOS_MCP_ENVELOPE_STRICT=0
