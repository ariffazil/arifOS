; arifos.service.d/03-one-origin.conf
; ════════════════════════════════════════════════════════════════════
; ONE_ORIGIN CLOSURE (2026-09-16) — ARIFOS::ONE_ORIGIN_CLOSURE::v1
;
; ExecStart repointed to the active release venv (/opt/arifos/current/venv)
; — the ONLY legal runtime origin. Legacy /opt/arifos/venv is a compat
; symlink for sibling services; /opt/arifos/app is retired from sys.path
; (see 50-execution-origin.conf, 333-AGI Fasa 2 WorkingDirectory flip).
;
; - ARIFOS_ENFORCE_ORIGIN=1 : build.py drift now fires when the live
;   import origin is outside the active venv (axis E closure)
; - ARIFOS_SESSION_STORE_PATH : deterministic FHS state, not xdg/tmp walk
; - ARIFOS_IDENTITY_TOML : host identity at /etc (installed by deploy)
; - ReadOnlyPaths=/opt/arifos : the service can never write its own code
;
; ROLLBACK: rm this file + `ln -sfn venv.legacy-one-origin /opt/arifos/venv`
; (after restoring the dir) + daemon-reload + restart.
;
; INSTALL (operator):
;   sudo install -m 0644 \
;       /root/arifOS/deploy/arifos.service.d/03-one-origin.conf \
;       /etc/systemd/system/arifos.service.d/03-one-origin.conf
; ════════════════════════════════════════════════════════════════════

[Service]
WorkingDirectory=/var/lib/arifos
ExecStart=
ExecStart=/opt/arifos/current/venv/bin/python -c "from arifosmcp.runtime.__main__ import main; main()"
Environment=ARIFOS_ACTIVE_VENV_ROOT=/opt/arifos/current/venv
Environment=ARIFOS_ENFORCE_ORIGIN=1
Environment=ARIFOS_SESSION_STORE_PATH=/var/lib/arifos/runtime_sessions.json
Environment=ARIFOS_IDENTITY_TOML=/etc/arifos/identity.toml
ReadOnlyPaths=/opt/arifos
