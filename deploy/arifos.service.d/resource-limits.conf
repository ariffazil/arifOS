[Service]
# arifOS kernel cgroup limits — F13 2026-11-23 (canary/9 preflight blocker).
#
# WHY THESE VALUES (measured, not guessed — FI-003 lane 333-AGI, 2026-11-23):
#
#   The previous values were MemoryHigh=3G / MemoryMax=4G / MemorySwapMax=1G.
#   THREE limits each independently caused the observed failure:
#
#   1. MemoryHigh=3G was BELOW the observed cgroup peak of 3.97 GiB. The
#      kernel therefore entered reclaim pressure on every real burst, not
#      just on pathological ones.
#   2. MemoryMax=4G was only 99.1% above that 3.97 GiB peak, so a slightly
#      larger legitimate burst OOM-kills the constitutional kernel mid-request
#      — the constitutional host must never be the thing that dies.
#   3. MemorySwapMax=1G was already 100% FULL at wedge time (swap.current
#      == swap.max == 1.00 GiB). When memory.high is exceeded, reclaim needs
#      an outlet; with none, the task is pinned in
#      mem_cgroup_handle_over_high (uninterruptible D state) and the event
#      loop never runs. The organ is not dead — it is WEDGED — so the
#      federation canary preflight reads "arifOS DOWN" and EVERY deploy in
#      the federation blocks.
#
#   Measured baseline (10h process lifetime):
#     RSS steady-state      0.92 GiB
#     RSS peak (VmHWM)      3.61 GiB
#     cgroup memory.peak    3.97 GiB
#
#   Derived:
#     MemoryHigh    = 6G  (1.51x the observed cgroup peak — normal bursts
#                            never enter reclaim pressure)
#     MemoryMax     = 8G  (2.02x the observed peak — a burst is reclaimed,
#                            not OOM-killed; the 1:2 high:max ratio keeps
#                            the kernel ALIVE under pressure)
#     MemorySwapMax = 4G  (reclaim's outlet; was 1G and already full)
#
#   Box headroom check: MemoryMax 8G <= 50% of the 32 GiB box RAM, so this
#   does not starve the other organs. Swap 4G <= 2x the 8.3 GiB free.
#
# OOMScoreAdjust=-500 keeps arifOS from being the OOM killer's first victim
# on the shared box. That is deliberate and unchanged.

CPUQuota=400%
MemoryAccounting=true
MemoryHigh=6G
MemoryMax=8G
MemorySwapMax=4G
OOMScoreAdjust=-500
TasksAccounting=true
TasksMax=2048
