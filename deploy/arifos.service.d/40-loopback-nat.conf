[Unit]
# TRACKED MIRROR of /etc/systemd/system/arifos.service.d/40-loopback-nat.conf
# Installed by operator action; nothing here copies it automatically (see README).
#
# 2026-09-28 · FI-003 · the mutating half of this drop-in is retired.
#
# Before: six `ExecStartPre=-/sbin/iptables …` lines, including `-F OUTPUT` and
# `-F POSTROUTING`, run under User=arifos. All six failed on every start with
#   iptables v1.8.11 (nf_tables): Could not fetch rule set generation id:
#   Permission denied (you must be root)
# reproduced independently in an equivalent systemd-run sandbox as
# status=4/NOPERMISSION. The `-` prefix swallowed every one of those failures, so
# the file silently owned nothing while its header claimed it bridged OpenClaw.
#
# Why that was not harmless:
#   1. Ownership is elsewhere. /etc/iptables/rules.v4 carries the OUTPUT DNAT and
#      the POSTROUTING MASQUERADE — netfilter-persistent owns this redirect.
#      Granting these lines privilege would not have "fixed" the bridge; it would
#      only have armed the flush.
#   2. The flush is not ours. `-F OUTPUT` deletes Docker's
#      `-A OUTPUT ! -d 127.0.0.0/8 … -j DOCKER`; `-F POSTROUTING` deletes
#      Tailscale's `-j ts-postrouting` plus three container MASQUERADE rules
#      (docker0, br-aadb3cc216e2, br-97da3cc44b2c). Shared chains, not re-added.
#
# Now: a witness, not a mutator. It probes the endpoint instead of reading
# netfilter state, because reading rules needs root and a rule-present check
# would report a configured-but-broken bridge as healthy. The question worth
# asking is whether the bridge answers.
After=network-online.target tailscaled.service
Wants=network-online.target

[Service]
# Non-fatal (-): an unreachable KVM4 edge must never block the kernel from booting.
# Loud: journal priority daemon.err, fixed tag arifos-nat — absence becomes visible.
# 01-clear-execstartpost.conf sorts first, so the unit's own ExecStartPost is
# cleared before this witness is appended.
# No printf format string on purpose: systemd expands "%s" as the unit's
# executable-path specifier and silently rewrote the message into "/bin/bash".
ExecStartPost=-/bin/sh -c '/usr/bin/curl -sf -m 5 -o /dev/null http://127.0.0.1:18789/.well-known/agent-card.json || /usr/bin/logger -p daemon.err -t arifos-nat "OPENCLAW BRIDGE UNREACHABLE: 127.0.0.1:18789 -> 100.64.0.5:18789 did not answer. The redirect is owned by netfilter-persistent: restore with iptables-restore < /etc/iptables/rules.v4, then check tailscale status for 100.64.0.5."'
