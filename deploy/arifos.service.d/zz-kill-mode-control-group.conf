# Ensures systemctl restart kills the ENTIRE process group, not just the
# main PID. Prevents orphaned worker processes (PPID=1) that survive
# restarts and hold stale code in memory.
# F1 AMANAH: reversible — rm this file + daemon-reload to revert.
[Service]
KillMode=control-group
